server:
  port: 8080

spring:
  application:
    name: civil-supplies-api

  profiles:
    # Defaults to prod so a deployment that forgets APP_PROFILE fails loudly on a
    # missing database or JWT_SECRET, rather than silently running on in-memory H2
    # with the public development signing key. Pass APP_PROFILE=dev for local work.
    active: ${APP_PROFILE:prod}

  # Jackson — camelCase by default (matches Angular frontend DTOs)
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Mail (optional — app works without SMTP)
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # Cache
  cache:
    type: simple

# ---- App-specific config ----
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-that-is-at-least-32-bytes-long!!}
    access-token-expiry-ms: 1800000    # 30 minutes
    refresh-token-expiry-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost,http://localhost:4200}
  mail:
    from: ${MAIL_FROM:noreply@civilsupplies.in}
    admin-notify-to: ${ADMIN_NOTIFY_TO:admin@civilsupplies.in}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    storage-type: ${STORAGE_TYPE:local}
  rate-limit:
    enquiries-per-hour: ${RATELIMIT_ENQUIRIES_PER_HOUR:10}
    quotes-per-hour: ${RATELIMIT_QUOTES_PER_HOUR:5}
    newsletter-per-hour: ${RATELIMIT_NEWSLETTER_PER_HOUR:5}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
